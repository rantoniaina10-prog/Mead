name: Build APK
on: [push, workflow_dispatch]
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 20}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: 17}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: npm install
      - run: npx cap add android && npx cap sync android
      - name: Icone
        run: |
          pip install pillow
          python3 - <<'PY'
          import base64,io,os
          from PIL import Image,ImageDraw
          B64=""
          BGC=(250,222,223)
          art=Image.open(io.BytesIO(base64.b64decode(B64))).convert('RGBA')
          W,H=art.size
          RES=os.environ.get('RES','android/app/src/main/res')
          def layer(size,hf):
              h=int(size*hf);w=int(h*W/H);a=art.resize((w,h),Image.LANCZOS)
              im=Image.new('RGBA',(size,size),(0,0,0,0));im.alpha_composite(a,((size-w)//2,(size-h)//2));return im
          def rounded(img,r):
              m=Image.new('L',img.size,0);ImageDraw.Draw(m).rounded_rectangle((0,0,img.size[0]-1,img.size[1]-1),r,fill=255)
              o=Image.new('RGBA',img.size,(0,0,0,0));o.paste(img,(0,0),m);return o
          def circle(img):
              m=Image.new('L',img.size,0);ImageDraw.Draw(m).ellipse((0,0,img.size[0]-1,img.size[1]-1),fill=255)
              o=Image.new('RGBA',img.size,(0,0,0,0));o.paste(img,(0,0),m);return o
          def full(size,hf):
              b=Image.new('RGBA',(size,size),BGC+(255,));b.alpha_composite(layer(size,hf));return b
          for n,f in {'mdpi':1,'hdpi':1.5,'xhdpi':2,'xxhdpi':3,'xxxhdpi':4}.items():
              d=f'{RES}/mipmap-{n}';os.makedirs(d,exist_ok=True)
              L=int(48*f);F=int(108*f)
              lg=full(L*4,0.74).resize((L,L),Image.LANCZOS)
              rounded(lg,int(L*0.2)).save(f'{d}/ic_launcher.png');circle(lg).save(f'{d}/ic_launcher_round.png')
              layer(F*4,0.46).resize((F,F),Image.LANCZOS).save(f'{d}/ic_launcher_foreground.png')
          os.makedirs(f'{RES}/values',exist_ok=True)
          open(f'{RES}/values/ic_launcher_background.xml','w').write('<?xml version="1.0" encoding="utf-8"?>\n<resources>\n    <color name="ic_launcher_background">#FADEDF</color>\n</resources>\n')
          print('icones ok')
          PY
      - run: cd android && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: hydromel-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
